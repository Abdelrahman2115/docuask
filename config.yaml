# DocuAsk configuration. Secrets live in .env, everything else lives here.
# Paths are relative to the project root.

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  index_dir: data/index

chunking:
  chunk_size: 800        # characters; tuned in Phase 6
  chunk_overlap: 120

embeddings:
  model: sentence-transformers/all-MiniLM-L6-v2
  multilingual_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2

vector_store:
  backend: chroma
  collection: docuask

retrieval:
  top_k: 4
  min_score: 0.0                  # 0 = off. Refuse early if the best match scores below this
  mode: vector                    # vector | bm25 | hybrid   (Phase 6 picks the best)
  rerank: false                   # cross-encoder reranking of the candidates
  candidates: 20                  # candidates considered by hybrid / rerank before cutting to top_k
  rrf_k: 60                       # Reciprocal Rank Fusion constant (standard value)
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2

llm:
  provider: groq                  # groq | ollama
  model: openai/gpt-oss-20b       # Groq free-tier model id; for ollama e.g. llama3.2:3b
  temperature: 0.0
  max_tokens: 1024                # reasoning models use part of this budget to think
  reasoning_effort: low           # gpt-oss: low | medium | high (less thinking = fewer tokens, faster)
  requests_per_minute: 20         # client-side limit; Groq free tier allows 30 RPM / 8K tokens per min
